<svg xmlns="http://www.w3.org/2000/svg" width="395" height="210" viewBox="0 0 395 210" role="img" aria-label="GitHub stats">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8e8e8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="394" height="209" rx="12" fill="url(#background)" stroke="#3a3a3a"/>
  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="30" y="46" font-size="18" font-weight="600" fill="#f5f5f5">GitHub stats</text>
    <text x="30" y="82" font-size="14" fill="#bdbdbd">Commits (last year)</text>
    <text x="365" y="82" font-size="14" font-weight="600" fill="#f5f5f5" text-anchor="end">111</text>
    <line x1="30" y1="91" x2="365" y2="91" stroke="#262626"/>
    <text x="30" y="108" font-size="14" fill="#bdbdbd">Pull requests</text>
    <text x="365" y="108" font-size="14" font-weight="600" fill="#f5f5f5" text-anchor="end">2</text>
    <line x1="30" y1="117" x2="365" y2="117" stroke="#262626"/>
    <text x="30" y="134" font-size="14" fill="#bdbdbd">Issues</text>
    <text x="365" y="134" font-size="14" font-weight="600" fill="#f5f5f5" text-anchor="end">0</text>
    <line x1="30" y1="143" x2="365" y2="143" stroke="#262626"/>
    <text x="30" y="160" font-size="14" fill="#bdbdbd">Stars earned</text>
    <text x="365" y="160" font-size="14" font-weight="600" fill="#f5f5f5" text-anchor="end">1</text>
    <line x1="30" y1="169" x2="365" y2="169" stroke="#262626"/>
    <text x="30" y="186" font-size="14" fill="#bdbdbd">Contributed to</text>
    <text x="365" y="186" font-size="14" font-weight="600" fill="#f5f5f5" text-anchor="end">5</text>
  </g>
</svg>
